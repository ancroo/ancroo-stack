services:
  whisper-rocm:
    build:
      context: ./tools/build/whisper-rocm
      dockerfile: Dockerfile
    container_name: whisper-rocm
    ipc: host
    restart: unless-stopped
    ports:
      - "${WHISPER_ROCM_PORT:-8002}:8000"
    environment:
      - TZ=${TZ}
      - WHISPER_MODEL=${WHISPER_ROCM_MODEL:-openai/whisper-large-v3-turbo}
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./data/whisper-rocm:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - ai-network
